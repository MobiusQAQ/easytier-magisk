# EasyTier Magisk 调试配置 (debug.conf)
#
# DEBUG=1: 开启深度调试模式
#   - 启动 easytier-core 时注入 RUST_LOG=debug,easytier=trace
#   - 在 log.log 中记录详细的路由探测、网卡切换与规则变更过程
#   - 禁用内核 AVC SIOCGIFINDEX 拒绝日志刷屏
#
# DEBUG=0: 正常模式（默认）
DEBUG=0

# easytier-core 的内部日志等级 (off / error / warn / info / debug / trace)
CORE_LOG_LEVEL=debug
