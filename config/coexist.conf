# ===== 与 TPROXY 透明代理（Clash / sing-box / v2ray 等）共存的参数 =====
#
# ⚠️ v2.7.0-hs2 起默认关闭（COEXIST_ENABLE=0）。
#    原因：hs1 无条件给 easytier 加 --socket-mark，在真机上直接导致整机失联——
#    Android 的 main 表通常为空，fwmark 规则指向 main 后会落到 netd 的
#    `32000: from all unreachable`，easytier 连 DNS 都发不出去（ENETUNREACH 101）。
#    现在改为显式开启，且开启后仍会先实测路由，通不过就自动回退。
#
# 开启方法：把下面的 COEXIST_ENABLE=0 改成 1，然后重启模块。
# 关闭方法：改回 0；或临时创建 disable_coexist 空文件（不用重启模块，下一轮生效）。
#
# 模块会做四件事：
#   1. 给带 ET_SOCKET_MARK 的数据包在 mangle OUTPUT 存 connmark 并 ACCEPT；
#   2. 在 mangle PREROUTING 链首按 connmark / mesh 与热点网段 / 监听端口放行，
#      使其不被其它代理的 TPROXY 劫持；
#   3. 添加 `ip rule pref <MAIN_RULE_PREF> fwmark <MARK> lookup <物理网卡表>`，
#      让 easytier 自己的出站流量绕过代理 tun 直连；
#   4. 加规则后立刻 `ip route get 8.8.8.8 mark <MARK>` 实测，不可达就撤销并
#      让 easytier 以不带 mark 的方式启动（宁可不共存，也不能断网）。

COEXIST_ENABLE=0

# easytier-core 底层 socket 的 fwmark（SO_MARK），十进制。
# 不要与其它代理已占用的 mark 冲突（Clash 常用 0x1，v2ray 常用 0xff）。
ET_SOCKET_MARK=20052

# fwmark 策略路由规则的优先级，数字越小越优先。
# 必须小于代理所用 ip rule 的 pref（Clash 常见 100），
# 否则 easytier 的标记流量还没来得及命中就被代理规则抢走。
MAIN_RULE_PREF=80

# ===== hs4 补充：ET_SOCKET_MARK 的合法性要求 =====
#
# ET_SOCKET_MARK 必须是**正整数**。留空 / 写 0 / 写非数字都会被拒绝启用。
# 原因：若被当成 0，`ip rule show` 里 netd 的基础规则
#   `16000: from all fwmark 0x0/0x10000 iif lo uidrange 0-0 lookup main`
# 会被当作"本模块的规则"匹配到并删除，等于拆掉 Android 的基础路由（整机断网）。
# hs4 已在 mark_hex / flush_mark_rules 里加了三重防护：
#   1. mark 非正整数 -> 直接不启用共存，且不做任何规则清理；
#   2. 清理时拒绝删除带 uidrange / iif / oif 特征的规则（netd 特征）；
#   3. 清理循环上限 8 条，避免误删扩大。
