name: Release EasyTier Magisk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave empty to use current version from module.prop)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip coreutils

      - name: Run regression tests
        run: |
          for t in tests/regression_*.sh tests/peer_cli_test.sh; do
            if [ -f "$t" ]; then
              echo "Running $t..."
              bash "$t"
            fi
          done

      - name: Build release packages
        run: |
          chmod +x build.sh
          ./build.sh all

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r')
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: EasyTier Magisk ${{ steps.get_tag.outputs.tag }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
